<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL History</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        min-height: 100vh;
        padding: 40px 20px;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -50%;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
        pointer-events: none;
      }

      body::after {
        content: '';
        position: absolute;
        bottom: -50%;
        left: -50%;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
        pointer-events: none;
      }

      .container {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 48px;
        max-width: 1100px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
        flex-wrap: wrap;
        gap: 20px;
      }

      h1 {
        color: #f1f5f9;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #10b981;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s;
        padding: 8px 12px;
        border-radius: 8px;
      }

      .nav-link:hover {
        background: rgba(16, 185, 129, 0.1);
        transform: translateX(-4px);
      }

      .table-container {
        overflow-x: auto;
        border-radius: 16px;
        border: 1px solid #334155;
        background: #0f172a;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #1e293b;
        color: #cbd5e1;
        font-weight: 600;
        text-align: left;
        padding: 18px 20px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid #334155;
      }

      td {
        padding: 18px 20px;
        color: #94a3b8;
        font-size: 14px;
        border-bottom: 1px solid #1e293b;
        word-break: break-all;
      }

      tr:last-child td {
        border-bottom: none;
      }

      tbody tr {
        transition: background 0.2s;
      }

      tbody tr:hover {
        background: #1e293b;
      }

      .short-url {
        color: #10b981;
        font-weight: 500;
        font-family: 'Courier New', monospace;
      }

      .empty-state {
        text-align: center;
        padding: 80px 20px;
      }

      .empty-state-icon {
        font-size: 64px;
        margin-bottom: 20px;
        opacity: 0.3;
      }

      .empty-state h2 {
        color: #cbd5e1;
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      .empty-state p {
        color: #64748b;
        font-size: 16px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 32px 24px;
        }

        h1 {
          font-size: 26px;
        }

        th, td {
          padding: 14px 16px;
          font-size: 13px;
        }

        .header {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      @media (max-width: 600px) {
        body {
          padding: 20px 10px;
        }

        .container {
          padding: 24px 20px;
        }

        th, td {
          padding: 12px 10px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>URL History</h1>
        <a href="/" class="nav-link">
          <span>←</span>
          <span>Back to Home</span>
        </a>
      </div>

      {% if urls %}
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Original URL</th>
              <th>Short URL</th>
            </tr>
          </thead>
          <tbody>
            {% for url in urls %}
            <tr>
              <td>{{ url.long_url }}</td>
              <td class="short-url">{{ request.host_url }}{{ url.short_code }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
      {% else %}
      <div class="empty-state">
        <div class="empty-state-icon">🔗</div>
        <h2>No History Yet</h2>
        <p>Your shortened URLs will appear here once you create them</p>
      </div>
      {% endif %}
    </div>
  </body>
</html>
