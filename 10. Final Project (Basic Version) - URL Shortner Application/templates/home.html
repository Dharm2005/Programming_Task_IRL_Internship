<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -50%;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
        pointer-events: none;
      }

      body::after {
        content: '';
        position: absolute;
        bottom: -50%;
        left: -50%;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
        pointer-events: none;
      }

      .container {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 48px;
        max-width: 650px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
      }

      h1 {
        color: #f1f5f9;
        font-size: 36px;
        font-weight: 700;
        margin-bottom: 12px;
        letter-spacing: -0.5px;
      }

      .subtitle {
        color: #94a3b8;
        font-size: 16px;
        line-height: 1.6;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #10b981;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 32px;
        transition: all 0.2s;
        padding: 8px 12px;
        border-radius: 8px;
      }

      .nav-link:hover {
        background: rgba(16, 185, 129, 0.1);
        transform: translateX(4px);
      }

      form {
        margin-bottom: 24px;
      }

      .input-group {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }

      input[type="text"] {
        flex: 1;
        padding: 16px 20px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 12px;
        font-size: 16px;
        color: #f1f5f9;
        transition: all 0.3s;
        outline: none;
      }

      input[type="text"]::placeholder {
        color: #64748b;
      }

      input[type="text"]:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      input[type="submit"],
      button {
        padding: 16px 32px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      input[type="submit"]:hover,
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      }

      input[type="submit"]:active,
      button:active {
        transform: translateY(0);
      }

      .error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 14px;
        margin-bottom: 16px;
      }

      .result-section {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 28px;
        margin-top: 32px;
      }

      .result-section h2 {
        color: #f1f5f9;
        font-size: 18px;
        margin-bottom: 20px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .result-section h2::before {
        content: '✓';
        display: inline-block;
        width: 24px;
        height: 24px;
        background: #10b981;
        border-radius: 50%;
        text-align: center;
        line-height: 24px;
        font-size: 14px;
      }

      .url-display {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      #shortUrl {
        flex: 1;
        padding: 14px 18px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        font-size: 14px;
        color: #10b981;
        font-weight: 500;
      }

      .copy-btn {
        padding: 14px 28px;
        white-space: nowrap;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      }

      .copy-btn:hover {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      }

      @media (max-width: 600px) {
        .container {
          padding: 32px 24px;
        }

        h1 {
          font-size: 28px;
        }

        .input-group {
          flex-direction: column;
        }

        .url-display {
          flex-direction: column;
        }

        #shortUrl {
          width: 100%;
        }

        .copy-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="/history" class="nav-link">
        <span>→</span>
        <span>View History</span>
      </a>
      
      <div class="header">
        <h1>URL Shortener</h1>
        <p class="subtitle">Transform long URLs into concise, shareable links</p>
      </div>

      <form action="" method="POST">
        <div class="input-group">
          <input type="text" name="url" placeholder="Paste your long URL here..." required />
          <input type="submit" value="Shorten" />
        </div>
      </form>
      
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      {% if data %}
      <div class="result-section">
        <h2>Your short link is ready!</h2>
        <div class="url-display">
          <input type="text" id="shortUrl" value="{{ request.host_url }}{{ data }}" readonly />
          <button class="copy-btn" onclick="copyUrl()">Copy Link</button>
        </div>
      </div>
      {% endif %}
    </div>

    <script>
      function copyUrl() {
        const input = document.getElementById("shortUrl");
        input.select();

        navigator.clipboard
          .writeText(input.value)
          .then(() => {
            alert("Short URL copied to clipboard!");
          })
          .catch(() => {
            alert("Failed to copy URL");
          });
      }
    </script>
  </body>
</html>
